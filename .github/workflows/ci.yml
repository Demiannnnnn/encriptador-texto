name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Comprobar sintaxis
        run: node --check "Proyecto Alura/encriptador.js"
      - name: Tests unitarios
        run: npm test
